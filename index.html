<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#581c87">
    <title>DAAD Gathering 2026 — Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        daad: {
                            ink: '#fafaf7',
                            night: '#0c0808',
                            panel: 'rgba(12, 8, 8, 0.72)',
                            line: 'rgba(255, 255, 255, 0.18)',
                        },
                    },
                    fontFamily: {
                        display: ['"Bebas Neue"', 'sans-serif'],
                        sans: ['Barlow', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        daad: '0 0 0 1px rgba(255, 255, 255, 0.12), 0 22px 48px rgba(0, 0, 0, 0.55)',
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Atmospheric BG: oversized rotating wash + soft vignette (no grid) */
        body.daad-poster {
            position: relative;
            color: #fafaf7;
            background: #07050a;
            isolation: isolate;
        }
        body.daad-poster::before {
            content: '';
            position: fixed;
            left: 50%;
            top: 50%;
            width: 200vmax;
            height: 200vmax;
            margin-left: -100vmax;
            margin-top: -100vmax;
            z-index: -2;
            transform-origin: 50% 50%;
            background: linear-gradient(
                115deg,
                #3d0a12 0%,
                #dc2626 14%,
                #c026d3 38%,
                #7c3aed 58%,
                #312e81 78%,
                #0f172a 100%
            );
            opacity: 0.9;
            animation: daad-aurora-rotate 60s linear infinite;
        }
        @keyframes daad-aurora-rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        body.daad-poster::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 85% 55% at 25% 10%, rgba(251, 113, 133, 0.18), transparent 52%),
                radial-gradient(ellipse 65% 70% at 88% 35%, rgba(196, 181, 253, 0.16), transparent 45%),
                radial-gradient(ellipse 50% 45% at 55% 85%, rgba(52, 211, 153, 0.06), transparent 50%),
                radial-gradient(ellipse 130% 95% at 50% 110%, rgba(0, 0, 0, 0.45), transparent 42%),
                radial-gradient(ellipse 120% 100% at 50% 50%, transparent 0%, rgba(4, 2, 8, 0.82) 100%);
        }
        @media (prefers-reduced-motion: reduce) {
            body.daad-poster::before {
                animation: none;
            }
        }
        .daad-frame {
            position: relative;
            --daad-corn: rgba(255, 255, 255, 0.7);
            --daad-len: 20px;
            --daad-th: 2px;
            --daad-inset: 12px;
        }
        .daad-frame::before {
            content: '';
            position: absolute;
            inset: var(--daad-inset);
            pointer-events: none;
            z-index: 0;
            background:
                linear-gradient(var(--daad-corn), var(--daad-corn)) top left / var(--daad-len) var(--daad-th) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) top left / var(--daad-th) var(--daad-len) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) top right / var(--daad-len) var(--daad-th) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) top right / var(--daad-th) var(--daad-len) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) bottom left / var(--daad-len) var(--daad-th) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) bottom left / var(--daad-th) var(--daad-len) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) bottom right / var(--daad-len) var(--daad-th) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) bottom right / var(--daad-th) var(--daad-len) no-repeat;
        }
        .daad-frame > * {
            position: relative;
            z-index: 1;
        }
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.25);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.45);
            border-radius: 0;
        }
        ::selection {
            background: #fef3c7;
            color: #1c1917;
        }
        select.daad-field option,
        .daad-field option {
            background-color: #1c0f14;
            color: #fafaf7;
        }
    </style>
</head>
<body class="daad-poster min-h-screen text-daad-ink antialiased font-sans">
    <!-- Header with Navigation -->
    <header class="border-b border-white/15 bg-black/35 backdrop-blur-md sticky top-0 z-20">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4 gap-4 flex-wrap">
                <div class="flex items-center gap-3">
                    <h1 class="font-display text-3xl sm:text-4xl tracking-[0.04em] uppercase leading-none text-white">
                        DAAD <span class="text-white/65 font-display">2026</span>
                    </h1>
                </div>
                <nav aria-label="Main">
                    <ul class="flex gap-6 font-sans text-xs uppercase tracking-[0.14em] font-semibold">
                        <li><a href="index.html" class="text-white hover:text-white/80 transition-colors">Personal lineup</a></li>
                        <li><a href="downloads.html" class="text-white hover:text-white/80 transition-colors">Full downloads</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 pb-32 relative z-10">
        <div class="mb-10">
            <h2 class="font-display text-4xl sm:text-5xl uppercase tracking-[0.06em] text-white mb-3">Personal lineup</h2>
            <p class="text-white/75 max-w-2xl text-sm sm:text-base leading-relaxed font-medium">
                Browse and filter every set. Tap rows to build your lineup. <br>
                Save for later or add to your calendar app to have it with you offline. <br>
                Official website: <a href="https://2026.daad.hu/" class="text-white underline decoration-white/35 underline-offset-2 hover:decoration-white">2026.daad.hu</a>.
            </p>
        </div>

        <!-- Filters and Controls -->
        <div class="daad-frame bg-black/45 backdrop-blur-sm border border-white/15 shadow-daad p-5 mb-6 rounded-sm">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-[0.12em] text-white/85 mb-2">Date</label>
                    <select id="dateFilter" class="daad-field w-full rounded-sm border border-white/20 bg-black/40 px-3 py-2.5 text-sm text-white focus:border-white/60 focus:ring-1 focus:ring-white/40 outline-none transition-shadow">
                        <option value="">All Dates</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-[0.12em] text-white/85 mb-2">Location</label>
                    <select id="locationFilter" class="daad-field w-full rounded-sm border border-white/20 bg-black/40 px-3 py-2.5 text-sm text-white focus:border-white/60 focus:ring-1 focus:ring-white/40 outline-none transition-shadow">
                        <option value="">All Locations</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-[0.12em] text-white/85 mb-2">Artist</label>
                    <input type="text" id="artistFilter" placeholder="Search artist…" class="daad-field w-full rounded-sm border border-white/20 bg-black/40 px-3 py-2.5 text-sm text-white placeholder:text-white/40 focus:border-white/60 focus:ring-1 focus:ring-white/40 outline-none transition-shadow">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-[0.12em] text-white/85 mb-2">Show</label>
                    <select id="selectionFilter" class="daad-field w-full rounded-sm border border-white/20 bg-black/40 px-3 py-2.5 text-sm text-white focus:border-white/60 focus:ring-1 focus:ring-white/40 outline-none transition-shadow">
                        <option value="all">All sets</option>
                        <option value="selected">In my lineup</option>
                        <option value="unselected">Not in my lineup</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Selection Overview Panel -->
        <div id="selectionOverview" class="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-black via-black/96 to-black/85 border-t border-white/20 p-4 transform transition-transform duration-300 translate-y-full z-30 shadow-[0_-8px_40px_rgba(0,0,0,0.9)]">
            <div class="container mx-auto">
                <div class="space-y-4">
                    <div>
                        <a id="toggleDetails" class="flex justify-between text-white hover:text-white/80 text-xs font-bold uppercase tracking-[0.12em] items-center cursor-pointer gap-3">
                            <span>Expand details — <span id="totalEvents">0</span> sets · <span id="totalDuration">0 hours</span></span>
                            <i class="fas fa-chevron-up transform transition-transform duration-200 text-white/60"></i>
                        </a>
                        <div id="stageDetails" class="mt-4 pb-8 hidden">
                            <div class="border-t border-b border-white/15 py-4">
                                <div id="stageStats" class="space-y-2">
                                    <!-- Stage statistics will be inserted here -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <button id="addToCalendar" type="button" class="inline-flex items-center font-sans text-xs font-bold uppercase tracking-[0.12em] px-4 py-2.5 rounded-sm bg-white text-neutral-900 hover:bg-neutral-200 transition-colors disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                            <i class="fas fa-calendar-plus mr-2"></i>Add to calendar
                        </button>
                        <button id="downloadIcs" type="button" class="inline-flex items-center font-sans text-xs font-bold uppercase tracking-[0.12em] px-4 py-2.5 rounded-sm bg-white text-neutral-900 hover:bg-neutral-200 transition-colors disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                            <i class="fas fa-download mr-2"></i>Download ICS
                        </button>
                        <button id="saveSelections" type="button" class="inline-flex items-center font-sans text-xs font-bold uppercase tracking-[0.12em] px-4 py-2.5 rounded-sm border border-white/55 text-white bg-transparent hover:bg-white/10 transition-colors disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                            <i class="fas fa-save mr-2"></i>Save selections
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Events Display: tabs (by stage | by day & time) -->
        <div class="daad-frame bg-black/45 backdrop-blur-sm border border-white/15 shadow-daad p-4 sm:p-6 mb-24 rounded-sm">
            <div class="flex flex-wrap gap-2 border-b border-white/15 pb-3 mb-5" role="tablist" aria-label="Lineup layout">
                <button type="button" id="tab-by-stage" role="tab" aria-selected="true" aria-controls="panel-by-stage"
                    class="tab-daad font-sans text-xs font-bold uppercase tracking-[0.12em] px-4 py-2 rounded-sm border transition-colors border-white bg-white text-neutral-900 hover:bg-neutral-100">
                    By stage
                </button>
                <button type="button" id="tab-by-schedule" role="tab" aria-selected="false" aria-controls="panel-by-schedule"
                    class="tab-daad font-sans text-xs font-bold uppercase tracking-[0.12em] px-4 py-2 rounded-sm border transition-colors border-white/35 text-white/90 bg-transparent hover:bg-white/10">
                    By day &amp; time
                </button>
            </div>
            <div id="panel-by-stage" role="tabpanel" aria-labelledby="tab-by-stage" class="tab-panel">
                <!-- stage grouping -->
            </div>
            <div id="panel-by-schedule" role="tabpanel" aria-labelledby="tab-by-schedule" class="tab-panel hidden">
                <!-- day / time-slot grouping -->
            </div>
        </div>
    </div>

    <script>
        const STAGE_STYLES = {
            'DAAD STAGE': {
                h2: 'border-l-fuchsia-500',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-fuchsia-950/45 border-fuchsia-400/85 ring-1 ring-fuchsia-400/50',
                chk: 'accent-fuchsia-400 border-white/35 bg-black/50',
            },
            'THE DOME': {
                h2: 'border-l-orange-500',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-orange-950/40 border-orange-400/85 ring-1 ring-orange-400/50',
                chk: 'accent-orange-400 border-white/35 bg-black/50',
            },
            'DRAGON NEST': {
                h2: 'border-l-emerald-400',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-emerald-950/45 border-emerald-400/85 ring-1 ring-emerald-400/50',
                chk: 'accent-emerald-400 border-white/35 bg-black/50',
            },
            'COOKING GROOVE': {
                h2: 'border-l-amber-400',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-amber-950/40 border-amber-400/85 ring-1 ring-amber-400/50',
                chk: 'accent-amber-300 border-white/35 bg-black/50',
            },
            'AM/BEACH': {
                h2: 'border-l-sky-400',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-sky-950/45 border-sky-400/85 ring-1 ring-sky-400/50',
                chk: 'accent-sky-400 border-white/35 bg-black/50',
            },
        };

        function stageRowStyle(location) {
            return STAGE_STYLES[location] || {
                h2: 'border-l-white/50',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-white/12 border-white ring-1 ring-white/45',
                chk: 'accent-white border-white/35 bg-black/50',
            };
        }

        // Fetch and process events data
        async function fetchEvents() {
            try {
                const response = await fetch('data/events.json');
                const data = await response.json();
                data.events.forEach(event => {
                    event.clean_title = event.summary
                        .toLowerCase()
                        .replace(/[^a-z0-9]/g, '_')
                        .replace(/_+/g, '_')
                        .replace(/^_|_$/g, '');
                });
                return data.events;
            } catch (error) {
                
                return [];
            }
        }

        // Format date for display
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Format duration
        function formatDuration(duration) {
            const hoursMatch = duration.match(/(\d+)H/);
            const minutesMatch = duration.match(/(\d+)M/);
            const hours = hoursMatch ? parseInt(hoursMatch[1]) : 0;
            const minutes = minutesMatch ? parseInt(minutesMatch[1]) : 0;
            
            if (hours === 0) {
                return `${minutes} minute${minutes !== 1 ? 's' : ''}`;
            } else if (minutes === 0) {
                return `${hours} hour${hours !== 1 ? 's' : ''}`;
            } else {
                return `${hours} hour${hours !== 1 ? 's' : ''} ${minutes} minute${minutes !== 1 ? 's' : ''}`;
            }
        }

        function formatDayHeading(dateKey) {
            const d = new Date(dateKey + 'T12:00:00');
            return d.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric',
            });
        }

        function formatClockLabel(isoStart) {
            const d = new Date(isoStart);
            return d.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
            });
        }

        function buildScheduleGroups(events) {
            const map = {};
            for (const event of events) {
                const day = event.startTime.split('T')[0];
                if (!map[day]) map[day] = {};
                const slotKey = event.startTime;
                if (!map[day][slotKey]) map[day][slotKey] = [];
                map[day][slotKey].push(event);
            }
            return Object.keys(map)
                .sort()
                .map((dateKey) => ({
                    dateKey,
                    slots: Object.keys(map[dateKey])
                        .sort()
                        .map((startKey) => ({
                            start: startKey,
                            events: map[dateKey][startKey].sort((a, b) =>
                                a.location.localeCompare(b.location)
                            ),
                        })),
                }));
        }

        function renderEventCard(event, options) {
            options = options || {};
            const st = stageRowStyle(event.location);
            const isSelected = window.selectedEvents.has(event.id);
            const rowBg = isSelected ? st.cardSel : st.cardDef;
            const sublineHtml = options.scheduleSlot
                ? `<p class="text-sm text-white/65 mt-0.5"><span class="text-white/55 uppercase tracking-wider text-xs font-semibold">${event.location}</span></p>`
                : `<p class="text-sm text-white/65 mt-0.5">${formatDate(event.startTime)}</p>`;
            return `
                            <div class="p-4 rounded-sm transition-all cursor-pointer border ${rowBg}"
                                 onclick="toggleEventSelection('${event.id}')">
                                <div class="flex justify-between items-start gap-3">
                                    <div class="flex items-start gap-3 min-w-0">
                                        <input type="checkbox" 
                                               class="mt-1 h-4 w-4 shrink-0 rounded-sm cursor-pointer ${st.chk}"
                                               ${isSelected ? 'checked' : ''}
                                               onclick="event.stopPropagation()"
                                               onchange="toggleEventSelection('${event.id}')">
                                        <div class="min-w-0">
                                            <h3 class="font-semibold text-white leading-snug">${event.summary}</h3>
                                            ${sublineHtml}
                                        </div>
                                    </div>
                                    <span class="text-xs font-semibold uppercase tracking-wider text-white/55 shrink-0">${formatDuration(event.duration)}</span>
                                </div>
                            </div>`;
        }

        function setActiveScheduleTab(tab) {
            const stageBtn = document.getElementById('tab-by-stage');
            const schedBtn = document.getElementById('tab-by-schedule');
            const stagePanel = document.getElementById('panel-by-stage');
            const schedPanel = document.getElementById('panel-by-schedule');
            const isStage = tab === 'stage';
            stageBtn.setAttribute('aria-selected', isStage);
            schedBtn.setAttribute('aria-selected', !isStage);
            const activeClass =
                'tab-daad font-sans text-xs font-bold uppercase tracking-[0.12em] px-4 py-2 rounded-sm border transition-colors border-white bg-white text-neutral-900 hover:bg-neutral-100';
            const idleClass =
                'tab-daad font-sans text-xs font-bold uppercase tracking-[0.12em] px-4 py-2 rounded-sm border transition-colors border-white/35 text-white/90 bg-transparent hover:bg-white/10';
            stageBtn.className = isStage ? activeClass : idleClass;
            schedBtn.className = isStage ? idleClass : activeClass;
            stagePanel.classList.toggle('hidden', !isStage);
            schedPanel.classList.toggle('hidden', isStage);
            try {
                localStorage.setItem('daadLineupViewTab', tab);
            } catch (e) {}
        }

        // Initialize the application
        async function init() {
            const events = await fetchEvents();
            // Add unique IDs to events
            events.forEach((event, index) => {
                event.id = `${event.startTime}-${event.location}-${event.summary}`.replace(/[^a-zA-Z0-9-]/g, '-');
            });
            const uniqueDates = [...new Set(events.map(event => event.startTime.split('T')[0]))];
            const uniqueLocations = [...new Set(events.map(event => event.location))];

            // Initialize selected events set from localStorage or create new Set
            const savedSelections = localStorage.getItem('daadSelectedEvents');
            window.selectedEvents = new Set(savedSelections ? JSON.parse(savedSelections) : []);
            window.lastSavedState = new Set(window.selectedEvents); // Track last saved state
            window.allEvents = events; // Store all events for reference

            // Show selection overview panel and enable buttons if there are saved selections
            if (window.selectedEvents.size > 0) {
                const overviewPanel = document.getElementById('selectionOverview');
                overviewPanel.classList.remove('translate-y-full');
                updateSelectionOverview(events);
                updateDownloadButton();
            }

            // Populate date filter
            const dateFilter = document.getElementById('dateFilter');
            uniqueDates.sort().forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = new Date(date).toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'long',
                    day: 'numeric'
                });
                dateFilter.appendChild(option);
            });

            // Populate location filter
            const locationFilter = document.getElementById('locationFilter');
            uniqueLocations.forEach(location => {
                const option = document.createElement('option');
                option.value = location;
                option.textContent = location;
                locationFilter.appendChild(option);
            });

            // Display events
            displayEvents(events);

            try {
                if (localStorage.getItem('daadLineupViewTab') === 'schedule') {
                    setActiveScheduleTab('schedule');
                }
            } catch (e) {}

            document.getElementById('tab-by-stage').addEventListener('click', () => setActiveScheduleTab('stage'));
            document.getElementById('tab-by-schedule').addEventListener('click', () => setActiveScheduleTab('schedule'));

            // Add event listeners
            document.getElementById('dateFilter').addEventListener('change', () => filterEvents(events, 'dateFilter'));
            document.getElementById('locationFilter').addEventListener('change', () => filterEvents(events, 'locationFilter'));
            document.getElementById('artistFilter').addEventListener('input', () => filterEvents(events, 'artistFilter'));
            document.getElementById('selectionFilter').addEventListener('change', () => filterEvents(events, 'selectionFilter'));
            document.getElementById('downloadIcs').addEventListener('click', () => downloadSelectedEvents(events));
            document.getElementById('addToCalendar').addEventListener('click', () => addToCalendar(events));
            document.getElementById('saveSelections').addEventListener('click', () => saveSelections());
            
            // Add toggle details event listener
            document.getElementById('toggleDetails').addEventListener('click', () => {
                const detailsSection = document.getElementById('stageDetails');
                const toggleIcon = document.querySelector('#toggleDetails i');
                if (detailsSection.classList.contains('hidden')) {
                    window.sa_event('selection_details_opened');
                    detailsSection.classList.remove('hidden');
                    toggleIcon.classList.add('rotate-180');
                } else {
                    window.sa_event('selection_details_closed');
                    detailsSection.classList.add('hidden');
                    toggleIcon.classList.remove('rotate-180');
                }
            });
        }

        // Filter events based on selected criteria
        function filterEvents(events, clickedFilterName) {
            if (clickedFilterName) {
                filter_value = document.getElementById(clickedFilterName).value;
                window.sa_event(clickedFilterName, {
                    filter_value: filter_value
                });
            }
            const dateFilter = document.getElementById('dateFilter').value;
            const locationFilter = document.getElementById('locationFilter').value;
            const artistFilter = document.getElementById('artistFilter').value.toLowerCase();
            const selectionFilter = document.getElementById('selectionFilter').value;

            const filteredEvents = events.filter(event => {
                const matchesDate = !dateFilter || event.startTime.startsWith(dateFilter);
                const matchesLocation = !locationFilter || event.location === locationFilter;
                const matchesArtist = !artistFilter || event.summary.toLowerCase().includes(artistFilter);
                const matchesSelection = selectionFilter === 'all' || 
                    (selectionFilter === 'selected' && window.selectedEvents.has(event.id)) ||
                    (selectionFilter === 'unselected' && !window.selectedEvents.has(event.id));
                return matchesDate && matchesLocation && matchesArtist && matchesSelection;
            });

            
            displayEvents(filteredEvents);
        }

        // Update download button state
        function updateDownloadButton() {
            const downloadButton = document.getElementById('downloadIcs');
            const addToCalendarButton = document.getElementById('addToCalendar');
            const saveButton = document.getElementById('saveSelections');
            const hasSelections = window.selectedEvents.size > 0;
            const hasUnsavedChanges = !areSetsEqual(window.selectedEvents, window.lastSavedState);
            
            downloadButton.disabled = !hasSelections;
            addToCalendarButton.disabled = !hasSelections;
            saveButton.disabled = !hasUnsavedChanges;
        }

        // Helper function to compare two Sets
        function areSetsEqual(set1, set2) {
            if (set1.size !== set2.size) return false;
            for (const item of set1) {
                if (!set2.has(item)) return false;
            }
            return true;
        }

        // Update selection overview
        function updateSelectionOverview(events) {
            const overviewPanel = document.getElementById('selectionOverview');
            const selectedEvents = events.filter(event => window.selectedEvents.has(event.id));
            
            if (selectedEvents.length === 0) {
                overviewPanel.classList.add('translate-y-full');
                return;
            }
            
            overviewPanel.classList.remove('translate-y-full');
            
            // Calculate statistics by stage
            const stageStats = {};
            selectedEvents.forEach(event => {
                if (!stageStats[event.location]) {
                    stageStats[event.location] = {
                        count: 0,
                        duration: 0
                    };
                }
                stageStats[event.location].count++;
                
                // Parse duration
                const duration = event.duration;
                const hoursMatch = duration.match(/(\d+)H/);
                const minutesMatch = duration.match(/(\d+)M/);
                const hours = hoursMatch ? parseInt(hoursMatch[1]) : 0;
                const minutes = minutesMatch ? parseInt(minutesMatch[1]) : 0;
                stageStats[event.location].duration += hours + (minutes / 60);
            });
            
            // Update stage statistics
            updateStageStats(stageStats);
            
            // Update total statistics
            const totalEvents = selectedEvents.length;
            const totalDuration = Object.values(stageStats)
                .reduce((sum, stats) => sum + stats.duration, 0);
            
            document.getElementById('totalEvents').textContent = totalEvents;
            document.getElementById('totalDuration').textContent = `${totalDuration.toFixed(1)} hours`;
        }

        // Toggle event selection
        function toggleEventSelection(eventId) {
            const event = window.allEvents.find(event => event.id === eventId);
            const artist_metadata = {
                artist: event.summary,
            }
            const stage_metadata = {
                stage: event.location,
            }
            if (window.selectedEvents.has(eventId)) {
                window.selectedEvents.delete(eventId);
                window.sa_event('removeArtist', artist_metadata);
                window.sa_event('removeAtStage', stage_metadata);
            } else {
                window.selectedEvents.add(eventId);
                window.sa_event('addArtist', artist_metadata);
                window.sa_event('addAtStage', stage_metadata);
            }
            
            updateDownloadButton();
            updateSelectionOverview(window.allEvents);
            
            // Re-filter events to update the view
            filterEvents(window.allEvents);
        }

        // Generate ICS content for selected events
        function generateIcsContent(events) {
            const selectedEvents = events.filter(event => window.selectedEvents.has(event.id));
            const icsEvents = selectedEvents.map(event => {
                const start = new Date(event.startTime).toISOString().replace(/[-:]/g, '').split('.')[0];
                const end = new Date(event.endTime).toISOString().replace(/[-:]/g, '').split('.')[0];
                
                return `BEGIN:VEVENT
DTSTART:${start}
DTEND:${end}
SUMMARY:[${event.location}] - ${event.summary}
LOCATION:${event.location}
DESCRIPTION:${event.description || ''}
END:VEVENT`;
            }).join('\n');

            return `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//DAAD Gathering 2025//EN
X-WR-CALNAME:DAAD Gathering 2025
X-WR-TIMEZONE:Europe/Berlin
${icsEvents}
END:VCALENDAR`;
        }

        // Download selected events as ICS file
        function downloadSelectedEvents(events) {
            const metadata = {
                total_events: events.length,
                total_duration: events.reduce((sum, event) => sum + parseInt(event.duration.replace('PT', '').replace('H', '')), 0)
            }
            window.sa_event('download_ics', metadata);
            const icsContent = generateIcsContent(events);
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'daad-gathering-2025-selected-events.ics';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Add selected events directly to calendar
        function addToCalendar(events) {
            const metadata = {
                total_events: events.length,
                total_duration: events.reduce((sum, event) => sum + parseInt(event.duration.replace('PT', '').replace('H', '')), 0)
            }
            window.sa_event('add_to_calendar', metadata);
            const icsContent = generateIcsContent(events);
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('type', 'text/calendar');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Display events in both tab panels
        function displayEvents(events) {
            const stagePanel = document.getElementById('panel-by-stage');
            const schedulePanel = document.getElementById('panel-by-schedule');
            displayListView(events, stagePanel);
            displayScheduleView(events, schedulePanel);
        }

        // Display events grouped by stage / venue
        function displayListView(events, container) {
            if (!events.length) {
                container.innerHTML =
                    '<p class="text-white/65 text-sm py-6 text-center">No sets match the current filters.</p>';
                return;
            }
            const groupedEvents = groupEventsByLocation(events);
            container.innerHTML = '';

            Object.entries(groupedEvents).forEach(([location, locationEvents]) => {
                const st = stageRowStyle(location);
                const locationSection = document.createElement('div');
                locationSection.className = 'mb-6';
                locationSection.innerHTML = `
                    <h2 class="font-display text-2xl sm:text-3xl uppercase tracking-[0.08em] text-white border-b border-white/15 pb-3 mb-4 pl-4 border-l-4 ${st.h2}">${location}</h2>
                    <div class="space-y-2">
                        ${locationEvents.map((event) => renderEventCard(event)).join('')}
                    </div>
                `;
                container.appendChild(locationSection);
            });
        }

        function displayScheduleView(events, container) {
            if (!events.length) {
                container.innerHTML =
                    '<p class="text-white/65 text-sm py-6 text-center">No sets match the current filters.</p>';
                return;
            }
            const days = buildScheduleGroups(events);
            container.innerHTML = days
                .map(
                    (day) => `
                <section class="mb-10 last:mb-2">
                    <h2 class="font-display text-2xl sm:text-3xl uppercase tracking-[0.08em] text-white border-b border-white/15 pb-3 mb-5">${formatDayHeading(day.dateKey)}</h2>
                    ${day.slots
                        .map((slot) => {
                            const conflict = slot.events.length > 1;
                            const gridClass = conflict
                                ? 'grid gap-2 sm:grid-cols-2'
                                : 'space-y-2';
                            const hint = conflict
                                ? `<span class="text-[10px] sm:text-xs font-bold uppercase tracking-[0.14em] text-amber-200/95 border border-amber-400/45 px-2 py-1 rounded-sm whitespace-nowrap">Same start — pick one stage</span>`
                                : '';
                            return `
                    <div class="mb-6 last:mb-0">
                        <div class="flex flex-wrap items-baseline gap-x-3 gap-y-2 mb-2 border-l-4 border-white/35 pl-3">
                            <h3 class="font-sans text-lg sm:text-xl font-bold text-white tabular-nums tracking-tight">${formatClockLabel(slot.start)}</h3>
                            ${hint}
                        </div>
                        <div class="${gridClass}">
                            ${slot.events.map((event) => renderEventCard(event, { scheduleSlot: true })).join('')}
                        </div>
                    </div>`;
                        })
                        .join('')}
                </section>`
                )
                .join('');
        }

        // Group events by location
        function groupEventsByLocation(events) {
            return events.reduce((groups, event) => {
                if (!groups[event.location]) {
                    groups[event.location] = [];
                }
                groups[event.location].push(event);
                return groups;
            }, {});
        }

        // Update stage statistics
        function updateStageStats(stageStats) {
            const stageStatsContainer = document.getElementById('stageStats');
            const selectedEvents = window.allEvents.filter(event => window.selectedEvents.has(event.id));
            
            // Calculate daily statistics
            const dailyStats = {};
            selectedEvents.forEach(event => {
                const date = event.startTime.split('T')[0];
                if (!dailyStats[date]) {
                    dailyStats[date] = {
                        count: 0,
                        duration: 0
                    };
                }
                dailyStats[date].count++;
                
                // Parse duration
                const duration = event.duration;
                const hoursMatch = duration.match(/(\d+)H/);
                const minutesMatch = duration.match(/(\d+)M/);
                const hours = hoursMatch ? parseInt(hoursMatch[1]) : 0;
                const minutes = minutesMatch ? parseInt(minutesMatch[1]) : 0;
                dailyStats[date].duration += hours + (minutes / 60);
            });

            // Sort dates
            const sortedDates = Object.keys(dailyStats).sort();

            stageStatsContainer.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <h4 class="font-display text-lg uppercase tracking-[0.12em] text-white mb-3">By stage</h4>
                        ${Object.entries(stageStats)
                            .map(([stage, stats]) => `
                                <div class="flex justify-between items-center gap-4 text-sm">
                                    <span class="text-white font-medium">${stage}</span>
                                    <div class="text-white/60 font-medium tabular-nums">
                                        <span>${stats.count} sets</span>
                                        <span class="mx-2 text-white/30">·</span>
                                        <span>${stats.duration.toFixed(1)} h</span>
                                    </div>
                                </div>
                            `).join('')}
                    </div>
                    <div class="border-t border-white/15 pt-4">
                        <h4 class="font-display text-lg uppercase tracking-[0.12em] text-white mb-3">By day</h4>
                        ${sortedDates
                            .map(date => {
                                const stats = dailyStats[date];
                                const formattedDate = new Date(date).toLocaleDateString('en-US', {
                                    weekday: 'short',
                                    month: 'short',
                                    day: 'numeric'
                                });
                                return `
                                    <div class="flex justify-between items-center gap-4 text-sm">
                                        <span class="text-white font-medium">${formattedDate}</span>
                                        <div class="text-white/60 font-medium tabular-nums">
                                            <span>${stats.count} sets</span>
                                            <span class="mx-2 text-white/30">·</span>
                                            <span>${stats.duration.toFixed(1)} h</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                    </div>
                </div>
            `;
        }

        // Save selections to localStorage
        function saveSelections() {
            const metadata = {
                total_events: window.selectedEvents.size
            }
            window.sa_event('save_selections', metadata);
            localStorage.setItem('daadSelectedEvents', JSON.stringify([...window.selectedEvents]));
            window.lastSavedState = new Set(window.selectedEvents); // Update last saved state
            
            // Show a temporary success message
            const saveButton = document.getElementById('saveSelections');
            const originalText = saveButton.innerHTML;
            saveButton.innerHTML = '<i class="fas fa-check mr-2"></i>Saved';
            saveButton.classList.remove('border', 'border-white/55', 'text-white', 'bg-transparent', 'hover:bg-white/10');
            saveButton.classList.add('bg-white', 'text-neutral-900', 'border', 'border-white', 'hover:bg-neutral-200');
            
            setTimeout(() => {
                saveButton.innerHTML = originalText;
                saveButton.classList.add('border', 'border-white/55', 'text-white', 'bg-transparent', 'hover:bg-white/10');
                saveButton.classList.remove('bg-white', 'text-neutral-900', 'border-white', 'hover:bg-neutral-200');
            }, 2000);

            updateDownloadButton(); // Update button states after saving
        }

        // Initialize the application when the page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
    <!-- 100% privacy-first analytics -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
