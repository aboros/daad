    <style>
        /* Atmospheric BG: oversized rotating wash + soft vignette (no grid) */
        body.daad-poster {
            position: relative;
            color: #fafaf7;
            background: #07050a;
            isolation: isolate;
        }
        body.daad-poster::before {
            content: '';
            position: fixed;
            left: 50%;
            top: 50%;
            width: 200vmax;
            height: 200vmax;
            margin-left: -100vmax;
            margin-top: -100vmax;
            z-index: -2;
            transform-origin: 50% 50%;
            background: linear-gradient(
                115deg,
                #3d0a12 0%,
                #dc2626 14%,
                #c026d3 38%,
                #7c3aed 58%,
                #312e81 78%,
                #0f172a 100%
            );
            opacity: 0.9;
            animation: daad-aurora-rotate 60s linear infinite;
        }
        @keyframes daad-aurora-rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        body.daad-poster::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 85% 55% at 25% 10%, rgba(251, 113, 133, 0.18), transparent 52%),
                radial-gradient(ellipse 65% 70% at 88% 35%, rgba(196, 181, 253, 0.16), transparent 45%),
                radial-gradient(ellipse 50% 45% at 55% 85%, rgba(52, 211, 153, 0.06), transparent 50%),
                radial-gradient(ellipse 130% 95% at 50% 110%, rgba(0, 0, 0, 0.45), transparent 42%),
                radial-gradient(ellipse 120% 100% at 50% 50%, transparent 0%, rgba(4, 2, 8, 0.82) 100%);
        }
        @media (prefers-reduced-motion: reduce) {
            body.daad-poster::before {
                animation: none;
            }
        }
        .daad-frame {
            position: relative;
            --daad-corn: rgba(255, 255, 255, 0.7);
            --daad-len: 20px;
            --daad-th: 2px;
            --daad-inset: 12px;
        }
        .daad-frame::before {
            content: '';
            position: absolute;
            inset: var(--daad-inset);
            pointer-events: none;
            z-index: 0;
            background:
                linear-gradient(var(--daad-corn), var(--daad-corn)) top left / var(--daad-len) var(--daad-th) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) top left / var(--daad-th) var(--daad-len) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) top right / var(--daad-len) var(--daad-th) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) top right / var(--daad-th) var(--daad-len) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) bottom left / var(--daad-len) var(--daad-th) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) bottom left / var(--daad-th) var(--daad-len) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) bottom right / var(--daad-len) var(--daad-th) no-repeat,
                linear-gradient(var(--daad-corn), var(--daad-corn)) bottom right / var(--daad-th) var(--daad-len) no-repeat;
        }
        .daad-frame > * {
            position: relative;
            z-index: 1;
        }

        .daad-sticky-heading {
            transition: background-color 0.22s ease-out, -webkit-backdrop-filter 0.22s ease-out, backdrop-filter 0.22s ease-out;
            background-color: transparent;
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
        }
        .daad-sticky-heading.is-stuck {
            background-color: rgba(0, 0, 0, 0.4);
            -webkit-backdrop-filter: blur(48px);
            backdrop-filter: blur(48px);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.25);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.45);
            border-radius: 0;
        }
        ::selection {
            background: #fef3c7;
            color: #1c1917;
        }
        select.daad-field option,
        .daad-field option {
            background-color: #1c0f14;
            color: #fafaf7;
        }
        .daad-schedule-loading-overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.28s ease, visibility 0.28s ease;
            pointer-events: none;
        }
        .daad-schedule-loading-overlay.is-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        @media (prefers-reduced-motion: reduce) {
            .daad-schedule-loading-overlay {
                transition-duration: 0.05s;
            }
            .daad-loading-spinner {
                animation: none !important;
                border-top-color: rgba(250, 250, 247, 0.5);
            }
        }

        /* Install gate: stacking + layout + padding from this file so a stale precached app.css
           cannot strip Tailwind utilities used only in JS (same issue as z-[110]). */
        #daadInstallGate {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            pointer-events: auto;
            isolation: isolate;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            box-sizing: border-box;

            z-index: 1;
            width: 100%;
            max-width: 28rem;
            box-sizing: border-box;

            padding: 2rem 1.5rem;

                0 22px 48px rgba(0, 0, 0, 0.55);

            backdrop-filter: blur(12px);
        }

        #daadInstallGate .daad-install-gate-panel h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.25rem;
            line-height: 1.3;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-align: center;
            color: #fff;
            margin: 0 0 0.75rem;
        }

        #daadInstallGate .daad-install-gate-lede {
            font-family: Barlow, system-ui, sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.625;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin: 0 0 1.5rem;
        }

        #daadInstallGate .daad-install-gate-steps {
            font-family: Barlow, system-ui, sans-serif;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.75);
            margin: 0 0 1.5rem;
        }

        #daadInstallGate .daad-install-gate-steps > * + * {
            margin-top: 1rem;
        }

        #daadInstallGate .daad-install-gate-steps .platform {
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            margin: 0 0 0.25rem;
        }

        #daadInstallGate .daad-install-gate-steps p {
            margin: 0;
            line-height: 1.625;
        }

        #daadInstallGate .daad-install-gate-steps .emph {
            font-weight: 600;
            color: #fff;
        }

        #daadInstallGate #daadInstallGateDismiss {
            font-family: Barlow, system-ui, sans-serif;
            display: block;
            width: 100%;
            box-sizing: border-box;
            border-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
        }

        #daadInstallGate #daadInstallGateDismiss:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #daadInstallGate #daadInstallGateDismiss:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.6);
            outline-offset: 2px;
        }

        /* Back to top (narrow screens): floats above lineup + selection strip */
        #daadBackToTop {
            position: fixed;
            right: max(1rem, env(safe-area-inset-right));
            bottom: calc(max(1rem, env(safe-area-inset-bottom) + 0.25rem) + var(--daad-back-to-top-extra, 0px));
            z-index: 40;
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(0, 0, 0, 0.72);
            color: #fafaf7;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(0.5rem);
            transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
        }
        #daadBackToTop.daad-back-to-top--visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }
        #daadBackToTop:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.55);
            outline-offset: 3px;
        }
        @media (min-width: 768px) {
            #daadBackToTop {
                display: none;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            #daadBackToTop {
                transition-duration: 0.05s;
            }
        }
    </style>
</head>

    <script>
        const STAGE_STYLES = {
            'DAAD STAGE': {
                h2: 'border-l-fuchsia-500',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-fuchsia-950/45 border-fuchsia-400/85 ring-1 ring-fuchsia-400/50',
                chk: 'accent-fuchsia-400 border-white/35 bg-black/50',
                metaLabel: 'text-fuchsia-400/85',
            },
            'THE DOME': {
                h2: 'border-l-orange-500',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-orange-950/40 border-orange-400/85 ring-1 ring-orange-400/50',
                chk: 'accent-orange-400 border-white/35 bg-black/50',
                metaLabel: 'text-orange-400/85',
            },
            'DRAGON NEST': {
                h2: 'border-l-emerald-400',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-emerald-950/45 border-emerald-400/85 ring-1 ring-emerald-400/50',
                chk: 'accent-emerald-400 border-white/35 bg-black/50',
                metaLabel: 'text-emerald-400/85',
            },
            'COOKING GROOVE': {
                h2: 'border-l-amber-400',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-amber-950/40 border-amber-400/85 ring-1 ring-amber-400/50',
                chk: 'accent-amber-300 border-white/35 bg-black/50',
                metaLabel: 'text-amber-400/85',
            },
            'AM/BEACH': {
                h2: 'border-l-sky-400',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-sky-950/45 border-sky-400/85 ring-1 ring-sky-400/50',
                chk: 'accent-sky-400 border-white/35 bg-black/50',
                metaLabel: 'text-sky-400/85',
            },
        };

        function stageRowStyle(location) {
            return STAGE_STYLES[location] || {
                h2: 'border-l-white/50',
                cardDef: 'bg-black/40 border-white/10 hover:border-white/25',
                cardSel: 'bg-white/12 border-white ring-1 ring-white/45',
                chk: 'accent-white border-white/35 bg-black/50',
                metaLabel: 'text-white',
            };
        }

        const EVENT_TIMEZONE = 'Europe/Budapest';

        function normalizeStageName(raw) {
            const s = String(raw || '').trim().replace(/\s+/g, ' ');
            if (!s) return '';
            return s.toUpperCase();
        }

        function normalizeFetchedEvent(raw) {
            const idNum = Number(raw.id);
            if (!Number.isInteger(idNum)) throw new Error('Invalid or missing integer id');

            const startUtcMs = Number(raw.startUtcMs);
            const endUtcMs = Number(raw.endUtcMs);
            if (!Number.isFinite(startUtcMs) || !Number.isFinite(endUtcMs) || endUtcMs < startUtcMs) {
                throw new Error('Invalid startUtcMs / endUtcMs');
            }
            const dayKey = String(raw.dayKey || '').trim();
            if (!/^\d{4}-\d{2}-\d{2}$/.test(dayKey)) throw new Error('Invalid dayKey');

            const summary = String(raw.summary || '').trim();
            if (!summary) throw new Error('Missing summary');

            const duration = String(raw.duration || '').trim();
            if (!/^PT/i.test(duration)) throw new Error('Invalid duration ISO string');

            const tagsIn = raw.tags;
            const tags =
                Array.isArray(tagsIn) ? tagsIn.map((t) => String(t || '').trim().toLowerCase()).filter(Boolean) : [];

            const loc = normalizeStageName(raw.location || '');
            if (!loc) throw new Error('Missing location');

            const sampleSetUrl = String(raw.sampleSetUrl || '').trim();

            return {
                id: idNum,
                summary,
                location: loc,
                startUtcMs,
                endUtcMs,
                dayKey,
                duration,
                startTime: String(raw.startTime || ''),
                endTime: String(raw.endTime || ''),
                description: raw.description === undefined ? '' : String(raw.description),
                sampleSetUrl,
                tags,
            };
        }

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function isHttpUrl(u) {
            return /^https?:\/\/.+/i.test(String(u || '').trim());
        }

        /** HTTPS SoundCloud permalinks / share links (valid for oEmbed thumbnail lookup). */
        function isSoundCloudEmbedUrl(u) {
            try {
                const parsed = new URL(String(u || '').trim());
                if (!(parsed.protocol === 'http:' || parsed.protocol === 'https:')) return false;
                const host = parsed.hostname.replace(/^www\./i, '').toLowerCase();
                return (
                    host === 'soundcloud.com' ||
                    host.endsWith('.soundcloud.com')
                );
            } catch (_) {
                return false;
            }
        }

        const YOUTUBE_VIDEO_ID_RE = /^[A-Za-z0-9_-]{11}$/;
        /** @returns {string} 11-char id or '' */
        function extractYouTubeVideoId(rawUrl) {
            try {
                const u = new URL(String(rawUrl || '').trim());
                if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
                const host = u.hostname.replace(/^www\./i, '').toLowerCase();
                const yt =
                    host === 'youtu.be' ||
                    host === 'youtube.com' ||
                    host === 'youtube-nocookie.com' ||
                    host === 'm.youtube.com' ||
                    host === 'music.youtube.com';
                if (!yt) return '';

                if (host === 'youtu.be') {
                    const seg = u.pathname.split('/').filter(Boolean)[0] || '';
                    return YOUTUBE_VIDEO_ID_RE.test(seg) ? seg : '';
                }

                const v = u.searchParams.get('v');
                if (v && YOUTUBE_VIDEO_ID_RE.test(v)) return v;

                const pathId = u.pathname.match(/\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{11})(?:\/|$|[?#])/);
                if (pathId && YOUTUBE_VIDEO_ID_RE.test(pathId[1])) return pathId[1];

                const watchPathOnly = u.pathname.match(/^\/watch\/([^/?#]+)\/?$/);
                if (
                    watchPathOnly &&
                    YOUTUBE_VIDEO_ID_RE.test(watchPathOnly[1])
                )
                    return watchPathOnly[1];

                return '';
            } catch (_) {
                return '';
            }
        }

        /** Channel pages (UC…) — avatar URL via unavatar (see buildYouTubeSampleAsideInner). */
        function extractYouTubeChannelIdForThumb(rawUrl) {
            try {
                const u = new URL(String(rawUrl || '').trim());
                if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
                const host = u.hostname.replace(/^www\./i, '').toLowerCase();
                const allow =
                    host === 'youtube.com' ||
                    host === 'youtube-nocookie.com' ||
                    host === 'm.youtube.com' ||
                    host === 'music.youtube.com';
                if (!allow) return '';
                const m = u.pathname.match(/^\/channel\/([^/?#]+)\/?$/);
                if (!m) return '';
                const id = decodeURIComponent(m[1]);
                return /^UC[A-Za-z0-9_-]{10,}$/.test(id) ? id : '';
            } catch (_) {
                return '';
            }
        }

        function isYouTubeMusicBrowseUrl(rawUrl) {
            try {
                const u = new URL(String(rawUrl || '').trim());
                if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
                const host = u.hostname.replace(/^www\./i, '').toLowerCase();
                if (host !== 'music.youtube.com') return false;
                return /^\/browse\//i.test(u.pathname || '');
            } catch (_) {
                return false;
            }
        }

        function youtubeSampleAsideSupported(rawUrl) {
            const s = String(rawUrl || '').trim();
            return (
                !!extractYouTubeVideoId(s) ||
                !!extractYouTubeChannelIdForThumb(s) ||
                isYouTubeMusicBrowseUrl(s)
            );
        }

        /** Microlink open API — used for youtube music /browse URLs (video id cannot be inferred). See microlink.io */
        const microlinkOgImageUrlByPage = new Map();
        function fetchMicrolinkImageUrl(pageUrl) {
            const key = String(pageUrl || '').trim();
            if (!key) return Promise.reject(new Error('empty microlink url'));
            if (microlinkOgImageUrlByPage.has(key)) return microlinkOgImageUrlByPage.get(key);
            const task = fetch(`https://api.microlink.io/?url=${encodeURIComponent(key)}`)
                .then((res) => {
                    if (!res.ok) throw new Error(`microlink ${res.status}`);
                    return res.json();
                })
                .then((d) => {
                    const img = d && d.data && d.data.image && d.data.image.url;
                    if (!img) throw new Error('microlink: no image');
                    return img;
                });
            microlinkOgImageUrlByPage.set(key, task);
            return task;
        }

        function hydrateYouTubeMicrolinkThumbs(root) {
            if (!root || typeof root.querySelectorAll !== 'function') return;
            root.querySelectorAll('[data-yt-microlink-thumb]').forEach((slot) => {
                const pageUrl = slot.getAttribute('data-yt-microlink-thumb');
                if (!pageUrl) return;
                slot.removeAttribute('data-yt-microlink-thumb');
                fetchMicrolinkImageUrl(pageUrl)
                    .then((thumbSrc) => {
                        slot.removeAttribute('aria-busy');
                        slot.className = SAMPLE_THUMB_SHELL;
                        const a = document.createElement('a');
                        a.href = pageUrl;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.className = SAMPLE_THUMB_HIT;
                        a.addEventListener('click', (e) => e.stopPropagation());
                        const img = document.createElement('img');
                        img.src = thumbSrc;
                        img.alt = '';
                        img.loading = 'lazy';
                        img.decoding = 'async';
                        img.className = SAMPLE_THUMB_IMG;
                        const overlay = document.createElement('span');
                        overlay.className = SAMPLE_THUMB_OVERLAY;
                        overlay.setAttribute('aria-hidden', 'true');
                        a.appendChild(img);
                        a.appendChild(overlay);
                        slot.replaceChildren(a);
                    })
                    .catch(() => {
                        slot.removeAttribute('aria-busy');
                        slot.classList.add('hidden');
                        slot.replaceChildren();
                    });
            });
        }

        /** Label for Youtube vs Youtube Music outbound links */
        function youTubeAsideLinkLabel(trimmedRaw) {
            try {
                const host = new URL(trimmedRaw).hostname.replace(/^www\./i, '').toLowerCase();
                return host === 'music.youtube.com' ? 'Open in YouTube Music' : 'Watch on YouTube';
            } catch (_) {
                return 'Watch on YouTube';
            }
        }

        /** Caches oEmbed JSON promises (dedupes network for same URL across cards / re-filters). */
        const soundCloudOembedJsonByUrl = new Map();

        /** @see https://developers.soundcloud.com/docs/oembed */
        function fetchSoundCloudOembedJson(trackUrl) {
            const key = String(trackUrl || '').trim();
            if (!key) return Promise.reject(new Error('empty SoundCloud URL'));
            if (soundCloudOembedJsonByUrl.has(key)) return soundCloudOembedJsonByUrl.get(key);
            const task = (async () => {
                const o = new URL('https://soundcloud.com/oembed');
                o.searchParams.set('format', 'json');
                o.searchParams.set('url', key);
                const res = await fetch(o, { credentials: 'omit', mode: 'cors' });
                if (!res.ok) throw new Error(`SoundCloud oEmbed HTTP ${res.status}`);
                const data = await res.json();
                if (!data || typeof data !== 'object') throw new Error('invalid oEmbed response');
                return data;
            })();
            soundCloudOembedJsonByUrl.set(key, task);
            return task;
        }

        /** Hover: darken gradient overlay, brighten image; footer link warms to amber (named group `sample-thumb`). */
        const SAMPLE_THUMB_GROUP_WRAP = 'group/sample-thumb flex w-full flex-col items-end gap-1';
        const SAMPLE_THUMB_SHELL =
            'relative aspect-square max-h-[5lh] w-[min(5lh,100%)] shrink-0 overflow-hidden rounded-sm border border-white/10 bg-black/25';
        const SAMPLE_THUMB_IMG =
            'absolute inset-0 h-full w-full origin-center scale-100 transform object-cover transition duration-300 ease-out group-hover/sample-thumb:scale-[1.05] group-hover/sample-thumb:brightness-115 group-hover/sample-thumb:saturate-110';
        const SAMPLE_THUMB_OVERLAY =
            'pointer-events-none absolute inset-0 z-[1] bg-gradient-to-t from-black/70 via-black/55 to-black/45 transition duration-300 ease-out group-hover/sample-thumb:from-black/40 group-hover/sample-thumb:via-black/30 group-hover/sample-thumb:to-black/18';
        const SAMPLE_THUMB_HIT =
            'absolute inset-0 z-[2] block outline-none ring-sky-400/0 focus-visible:ring-2 focus-visible:ring-sky-400/80';
        const SAMPLE_THUMB_FOOTER_P = 'max-w-[min(22ch,calc(5lh+8ch))]';
        const SAMPLE_THUMB_ACTION_LINK =
            'text-[11px] font-semibold text-sky-300/90 underline decoration-sky-400/45 underline-offset-2 transition duration-300 ease-out hover:text-amber-100 hover:decoration-amber-300/65 group-hover/sample-thumb:text-amber-50 group-hover/sample-thumb:decoration-amber-200/70';

        function hydrateSoundCloudSampleCovers(root) {
            if (!root || typeof root.querySelectorAll !== 'function') return;
            root.querySelectorAll('[data-soundcloud-track-url]').forEach((slot) => {
                const trackUrl = slot.getAttribute('data-soundcloud-track-url');
                if (!trackUrl) return;
                slot.removeAttribute('data-soundcloud-track-url');
                fetchSoundCloudOembedJson(trackUrl)
                    .then((data) => {
                        const thumb = data && data.thumbnail_url;
                        if (!thumb) throw new Error('no thumbnail_url');
                        const title = String((data && data.title) || 'SoundCloud').trim() || 'SoundCloud';
                        slot.removeAttribute('aria-busy');
                        slot.className = 'soundcloud-oembed-cover ' + SAMPLE_THUMB_SHELL;
                        const a = document.createElement('a');
                        a.href = trackUrl;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.className = SAMPLE_THUMB_HIT;
                        a.addEventListener('click', (e) => e.stopPropagation());
                        const img = document.createElement('img');
                        img.src = thumb;
                        img.alt = title;
                        img.loading = 'lazy';
                        img.decoding = 'async';
                        img.className = SAMPLE_THUMB_IMG;
                        const overlay = document.createElement('span');
                        overlay.className = SAMPLE_THUMB_OVERLAY;
                        overlay.setAttribute('aria-hidden', 'true');
                        a.appendChild(img);
                        a.appendChild(overlay);
                        slot.replaceChildren(a);
                    })
                    .catch(() => {
                        slot.removeAttribute('aria-busy');
                        slot.classList.add('hidden');
                        slot.replaceChildren();
                    });
            });
        }

        /** Right column: SoundCloud thumbnail + links (shared layout with plain sample aside). */
        function buildSoundCloudSampleAsideInner(sampleSetUrl) {
            const href = escapeHtml(sampleSetUrl);
            const openSoundCloud = `<a href="${href}" onclick="event.stopPropagation()" target="_blank" rel="noopener noreferrer" class="${SAMPLE_THUMB_ACTION_LINK}">Open on SoundCloud</a>`;
            return `<div class="${SAMPLE_THUMB_GROUP_WRAP}">
                    <div class="soundcloud-oembed-cover ${SAMPLE_THUMB_SHELL} flex items-center justify-center text-[10px] leading-tight text-white/40" data-soundcloud-track-url="${href}" aria-busy="true">Loading…</div>
                    <p class="${SAMPLE_THUMB_FOOTER_P}">${openSoundCloud}</p>
                </div>`;
        }

        /** Youtube aside: watch?v /watch/ID thumbnails (ytimg); /channel/UC… (unavatar); music /browse/* (Microlink og:image hydrate). */
        function buildYouTubeSampleAsideInner(sampleSetUrl) {
            const raw = String(sampleSetUrl || '').trim();
            const href = escapeHtml(raw);
            const ytLink = `<a href="${href}" onclick="event.stopPropagation()" target="_blank" rel="noopener noreferrer" class="${SAMPLE_THUMB_ACTION_LINK}">${escapeHtml(
                youTubeAsideLinkLabel(raw)
            )}</a>`;
            const footerLine = `<p class="${SAMPLE_THUMB_FOOTER_P}">${ytLink}</p>`;
            const thumbLoadingShell = `${SAMPLE_THUMB_SHELL} flex items-center justify-center text-[10px] leading-tight text-white/40`;
            let thumbBlock = '';
            const videoId = extractYouTubeVideoId(raw);
            if (videoId) {
                const thumbSrc = escapeHtml(`https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`);
                thumbBlock = `<div class="${SAMPLE_THUMB_SHELL}"><a href="${href}" target="_blank" rel="noopener noreferrer" class="${SAMPLE_THUMB_HIT}" onclick="event.stopPropagation()"><img src="${thumbSrc}" alt="" loading="lazy" decoding="async" class="${SAMPLE_THUMB_IMG}" referrerpolicy="no-referrer" /><span class="${SAMPLE_THUMB_OVERLAY}" aria-hidden="true"></span></a></div>`;
            } else {
                const channelId = extractYouTubeChannelIdForThumb(raw);
                if (channelId) {
                    const thumbEsc = escapeHtml(`https://unavatar.io/youtube/${encodeURIComponent(channelId)}`);
                    thumbBlock = `<div class="${SAMPLE_THUMB_SHELL}"><a href="${href}" target="_blank" rel="noopener noreferrer" class="${SAMPLE_THUMB_HIT}" onclick="event.stopPropagation()"><img src="${thumbEsc}" alt="" loading="lazy" decoding="async" class="${SAMPLE_THUMB_IMG}" referrerpolicy="no-referrer" /><span class="${SAMPLE_THUMB_OVERLAY}" aria-hidden="true"></span></a></div>`;
                } else if (isYouTubeMusicBrowseUrl(raw)) {
                    thumbBlock = `<div class="${thumbLoadingShell}" data-yt-microlink-thumb="${href}" aria-busy="true">Loading…</div>`;
                } else {
                    return buildPlainSampleAsideInner(raw);
                }
            }
            return `<div class="${SAMPLE_THUMB_GROUP_WRAP}">${thumbBlock}${footerLine}</div>`;
        }

        function buildPlainSampleAsideInner(sampleSetUrl) {
            const href = escapeHtml(sampleSetUrl);
            const linkClass =
                'text-[11px] font-semibold text-sky-300/95 hover:text-sky-200 underline decoration-sky-400/50 underline-offset-2';
            return `<p class="max-w-[min(22ch,calc(5lh+8ch))] pt-0.5"><a href="${href}" onclick="event.stopPropagation()" target="_blank" rel="noopener noreferrer" class="${linkClass}">Sample set</a></p>`;
        }

        function buildSampleAsideColumn(sampleSetUrl) {
            const trimmed = String(sampleSetUrl || '').trim();
            if (!isHttpUrl(trimmed)) return '';
            const label =
                '<p class="text-[10px] font-semibold uppercase tracking-[0.12em] leading-tight text-white/55">Sample set</p>';
            const body = isSoundCloudEmbedUrl(trimmed)
                ? buildSoundCloudSampleAsideInner(trimmed)
                : youtubeSampleAsideSupported(trimmed)
                  ? buildYouTubeSampleAsideInner(trimmed)
                  : buildPlainSampleAsideInner(trimmed);
            return `<aside class="pointer-events-auto flex max-w-[min(calc(5lh+8ch),42%)] shrink-0 flex-col items-end gap-1 self-start pl-3 text-right text-xs leading-normal sm:pl-4" onclick="event.stopPropagation()">${label}${body}</aside>`;
        }

        function syncDaadBodyScrollLock() {
            const loadingOverlay = document.getElementById('scheduleLoadingOverlay');
            const loadingActive =
                loadingOverlay && loadingOverlay.classList.contains('is-visible');
            const installGateOpen = !!document.getElementById('daadInstallGate');
            const shouldLock = loadingActive || installGateOpen;
            if (shouldLock) {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            }
            const overflow = shouldLock ? 'hidden' : '';
            document.documentElement.style.overflow = overflow;
            document.body.style.overflow = overflow;
        }

        window.addEventListener('load', () => {
            setTimeout(() => syncDaadBodyScrollLock(), 0);
        });
        window.addEventListener('pageshow', () => {
            setTimeout(() => syncDaadBodyScrollLock(), 0);
        });

        async function fetchEvents() {
            const banner = document.getElementById('scheduleLoadError');
            const overlay = document.getElementById('scheduleLoadingOverlay');
            const setLoading = (on) => {
                if (!overlay) return;
                overlay.classList.toggle('is-visible', !!on);
                overlay.setAttribute('aria-hidden', on ? 'false' : 'true');
                syncDaadBodyScrollLock();
            };
            setLoading(true);
            if (banner) {
                banner.classList.add('hidden');
                banner.textContent = '';
            }
            try {
                const response = await fetch('./data/events.json', {
                    credentials: 'same-origin',
                    cache: 'no-store',
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const parsed = await response.json();
                if (!Array.isArray(parsed)) throw new Error('Schedule data must be a JSON array');
                if (!parsed.length) throw new Error('Schedule has no events');
                const events = parsed.map(normalizeFetchedEvent);
                events.forEach((event) => {
                    event.clean_title = event.summary
                        .toLowerCase()
                        .replace(/[^a-z0-9]/g, '_')
                        .replace(/_+/g, '_')
                        .replace(/^_|_$/g, '');
                });
                return events;
            } catch (err) {
                if (banner) {
                    banner.textContent = 'Could not load data/events.json (static schedule file). ';
                    banner.textContent +=
                        err && err.message
                            ? `Details: ${err.message}`
                            : 'Open the developer console or check Network for ./data/events.json.';
                    banner.classList.remove('hidden');
                }
                console.error('fetchEvents:', err);
                return [];
            } finally {
                setLoading(false);
            }
        }

        function formatDuration(duration) {
            const hoursMatch = duration.match(/(\d+)H/i);
            const minutesMatch = duration.match(/(\d+)M/i);
            const hours = hoursMatch ? parseInt(hoursMatch[1]) : 0;
            const minutes = minutesMatch ? parseInt(minutesMatch[1]) : 0;
            
            if (hours === 0) {
                return `${minutes} minute${minutes !== 1 ? 's' : ''}`;
            } else if (minutes === 0) {
                return `${hours} hour${hours !== 1 ? 's' : ''}`;
            } else {
                return `${hours} hour${hours !== 1 ? 's' : ''} ${minutes} minute${minutes !== 1 ? 's' : ''}`;
            }
        }

        /** e.g. PT1H30M → `1h30m`; PT45M → `45m` */
        function formatCompactHmDuration(isoDur) {
            const hoursMatch = String(isoDur || '').match(/(\d+)H/i);
            const minutesMatch = String(isoDur || '').match(/(\d+)M/i);
            const hours = hoursMatch ? parseInt(hoursMatch[1], 10) : 0;
            const minutes = minutesMatch ? parseInt(minutesMatch[1], 10) : 0;
            if (hours <= 0 && minutes <= 0) return '';
            let s = '';
            if (hours > 0) s += `${hours}h`;
            if (minutes > 0) s += `${minutes}m`;
            return s;
        }

        /** 12-hour clock squeezed for subtitles, e.g. `8:00PM` */
        function formatStageCardClockLabel(utcMillis) {
            const raw = new Date(utcMillis).toLocaleTimeString('en-US', {
                timeZone: EVENT_TIMEZONE,
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
            });
            return raw.replace(/[\u202f\s]+/g, '');
        }

        /** By-stage tab: line 1 = weekday + start; line 2 = compact duration (Budapest wall time). */
        function buildStageListSublineHtml(event) {
            const weekday = new Date(event.startUtcMs).toLocaleDateString('en-US', {
                weekday: 'long',
                timeZone: EVENT_TIMEZONE,
            });
            const clock = formatStageCardClockLabel(event.startUtcMs);
            const line1 =
                `<span class="font-semibold text-white">${escapeHtml(weekday)}</span><span class="font-medium text-white/55">,</span> <span class="font-semibold text-white tabular-nums">${escapeHtml(clock)}</span>`;
            const hm = formatCompactHmDuration(event.duration);
            if (!hm) {
                return `<p class="min-w-0 text-sm leading-snug text-white/65">${line1}</p>`;
            }
            return `<div class="min-w-0 space-y-0.5 text-sm leading-snug text-white/65"><div>${line1}</div><div class="text-xs font-medium tabular-nums tracking-tight text-white/80">${escapeHtml(hm)}</div></div>`;
        }

        function formatDayHeading(dateKey) {
            return new Date(dateKey + 'T12:00:00').toLocaleDateString('en-US', {
                timeZone: EVENT_TIMEZONE,
                weekday: 'long',
                month: 'long',
                day: 'numeric',
            });
        }

        function formatClockLabel(utcMillis) {
            return new Date(utcMillis).toLocaleTimeString('en-US', {
                timeZone: EVENT_TIMEZONE,
                hour: 'numeric',
                minute: '2-digit',
            });
        }

        function buildScheduleGroups(events) {
            const map = {};
            for (const event of events) {
                const day = event.dayKey;
                if (!map[day]) map[day] = {};
                const slotKey = String(event.startUtcMs);
                if (!map[day][slotKey]) map[day][slotKey] = [];
                map[day][slotKey].push(event);
            }
            return Object.keys(map)
                .sort()
                .map((dateKey) => ({
                    dateKey,
                    slots: Object.keys(map[dateKey])
                        .map((k) => Number(k))
                        .sort((a, b) => a - b)
                        .map((startUtcMs) => ({
                            startUtcMs,
                            events: map[dateKey][String(startUtcMs)].sort((a, b) =>
                                a.location.localeCompare(b.location)
                            ),
                        })),
                }));
        }

        function renderEventCard(event, options) {
            options = options || {};
            const st = stageRowStyle(event.location);
            const isSelected = window.selectedEvents.has(event.id);
            const rowBg = isSelected ? st.cardSel : st.cardDef;
            const scheduleSlot = !!options.scheduleSlot;
            let metaRowHtml;
            if (scheduleSlot) {
                metaRowHtml = `<div class="mt-0.5 space-y-0.5 min-w-0">
                            <p class="text-sm min-w-0"><span class="uppercase tracking-wider text-xs font-semibold ${st.metaLabel}">${escapeHtml(event.location)}</span></p>
                            <p class="text-xs font-semibold uppercase tracking-wider text-white/55">${formatDuration(event.duration)}</p>
                        </div>`;
            } else {
                const sublineInner = buildStageListSublineHtml(event);
                metaRowHtml = `<div class="mt-0.5 flex flex-wrap items-baseline justify-between gap-x-3 gap-y-0.5">${sublineInner}</div>`;
            }
            const tagsHtml =
                event.tags && event.tags.length
                    ? `<div class="mt-2 flex flex-wrap gap-1.5">${event.tags
                          .map(
                              (t) =>
                                  `<span class="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-sm border border-white/20 text-white/70">${escapeHtml(t)}</span>`
                          )
                          .join('')}</div>`
                    : '';
            const trimmedSample = String(event.sampleSetUrl || '').trim();
            const sampleAsideHtml = buildSampleAsideColumn(trimmedSample);
            return `
                            <div class="rounded-sm transition-all cursor-pointer border p-4 ${rowBg}"
                                 onclick="toggleEventSelection(${event.id})">
                                <div class="flex min-w-0 items-start gap-3">
                                        <input type="checkbox" 
                                               class="mt-1 h-4 w-4 shrink-0 rounded-sm cursor-pointer ${st.chk}"
                                               ${isSelected ? 'checked' : ''}
                                               onclick="event.stopPropagation()"
                                               onchange="toggleEventSelection(${event.id})">
                                        <div class="min-w-0 flex-1">
                                            <h3 class="font-semibold leading-snug text-white">${escapeHtml(event.summary)}</h3>
                                            ${metaRowHtml}
                                            ${tagsHtml}
                                        </div>
                                        ${sampleAsideHtml}
                                </div>
                            </div>`;
        }

        function setActiveScheduleTab(tab) {
            const stageBtn = document.getElementById('tab-by-stage');
            const schedBtn = document.getElementById('tab-by-schedule');
            const stagePanel = document.getElementById('panel-by-stage');
            const schedPanel = document.getElementById('panel-by-schedule');
            const isStage = tab === 'stage';
            stageBtn.setAttribute('aria-selected', isStage);
            schedBtn.setAttribute('aria-selected', !isStage);
            const activeClass =
                'tab-daad font-sans text-xs font-bold uppercase tracking-[0.12em] px-4 py-2 rounded-sm border transition-colors border-white bg-white text-neutral-900 hover:bg-neutral-100';
            const idleClass =
                'tab-daad font-sans text-xs font-bold uppercase tracking-[0.12em] px-4 py-2 rounded-sm border transition-colors border-white/35 text-white/90 bg-transparent hover:bg-white/10';
            stageBtn.className = isStage ? activeClass : idleClass;
            schedBtn.className = isStage ? idleClass : activeClass;
            stagePanel.classList.toggle('hidden', !isStage);
            schedPanel.classList.toggle('hidden', isStage);
            try {
                localStorage.setItem('daadLineupViewTab', tab);
            } catch (e) {}
        }

        const MORE_FILTERS_MIN_WIDTH = 768; // matches Tailwind md — collapsed summary only below this width

        function syncMoreFiltersDetailsOpen() {
            const details = document.getElementById('moreFilters');
            if (!details) return;
            details.open = window.matchMedia(`(min-width: ${MORE_FILTERS_MIN_WIDTH}px)`).matches;
        }

        let moreFiltersResizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(moreFiltersResizeTimer);
            moreFiltersResizeTimer = setTimeout(() => {
                syncMoreFiltersDetailsOpen();
                syncDaadStickyTop();
                syncBackToTopOffset();
                updateStickyHeadingStates();
            }, 150);
        });

        function syncDaadStickyTop() {
            const header = document.getElementById('daadSiteHeader');
            if (!header) return;
            document.documentElement.style.setProperty('--daad-sticky-top', `${header.offsetHeight}px`);
        }

        function syncBackToTopOffset() {
            const btn = document.getElementById('daadBackToTop');
            const overview = document.getElementById('selectionOverview');
            if (!btn) return;
            let extra = 0;
            if (overview && !overview.classList.contains('translate-y-full')) {
                extra = Math.round(overview.getBoundingClientRect().height) + 12;
            }
            btn.style.setProperty('--daad-back-to-top-extra', `${extra}px`);
        }

        function updateBackToTopButton() {
            const btn = document.getElementById('daadBackToTop');
            if (!btn) return;
            if (window.matchMedia('(min-width: 768px)').matches) {
                btn.classList.remove('daad-back-to-top--visible');
                btn.setAttribute('aria-hidden', 'true');
                return;
            }
            const threshold = window.innerHeight * 2;
            const y = window.scrollY || document.documentElement.scrollTop || 0;
            const show = y > threshold;
            btn.classList.toggle('daad-back-to-top--visible', show);
            btn.setAttribute('aria-hidden', show ? 'false' : 'true');
        }

        function updateStickyHeadingStates() {
            const raw = getComputedStyle(document.documentElement).getPropertyValue('--daad-sticky-top').trim();
            let stickyTop = parseFloat(raw);
            if (!Number.isFinite(stickyTop)) stickyTop = 72;
            document.querySelectorAll('.daad-sticky-heading').forEach((el) => {
                const rect = el.getBoundingClientRect();
                const pinned = rect.top <= stickyTop + 0.75 && rect.bottom > stickyTop + 8;
                el.classList.toggle('is-stuck', pinned);
            });
            updateBackToTopButton();
        }

        let stickyHeadingScrollAttached = false;
        function ensureStickyHeadingScrollListener() {
            if (stickyHeadingScrollAttached) return;
            stickyHeadingScrollAttached = true;
            window.addEventListener('scroll', updateStickyHeadingStates, { passive: true });
        }

        let backToTopSetupDone = false;
        function ensureBackToTopControl() {
            if (backToTopSetupDone) return;
            const btn = document.getElementById('daadBackToTop');
            if (!btn) return;
            backToTopSetupDone = true;
            btn.addEventListener('click', () => {
                const instant = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                window.scrollTo({ top: 0, behavior: instant ? 'auto' : 'smooth' });
            });
            const overview = document.getElementById('selectionOverview');
            if (overview && typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(() => syncBackToTopOffset());
                ro.observe(overview);
            }
        }

        // Initialize the application
        async function init() {
            syncMoreFiltersDetailsOpen();
            syncDaadStickyTop();
            ensureBackToTopControl();
            syncBackToTopOffset();
            ensureStickyHeadingScrollListener();
            updateBackToTopButton();
            try {
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
            } catch (e) {}
            syncDaadStickyTop();
            const events = await fetchEvents();
            const uniqueDates = [...new Set(events.map((event) => event.dayKey))];
            const uniqueLocations = [...new Set(events.map(event => event.location))];

            const savedSelections = localStorage.getItem('daadSelectedEvents');
            const parsedSelections = savedSelections ? JSON.parse(savedSelections) : [];
            const saneIds =
                Array.isArray(parsedSelections) &&
                parsedSelections.map((id) => Number(id)).every((id) => Number.isInteger(id));
            window.selectedEvents = new Set(saneIds ? parsedSelections.map(Number) : []);
            window.allEvents = events; // Store all events for reference

            // Show selection overview panel if there are saved selections
            if (window.selectedEvents.size > 0) {
                const overviewPanel = document.getElementById('selectionOverview');
                overviewPanel.classList.remove('translate-y-full');
                updateSelectionOverview(events);
            }

            // Populate date filter
            const dateFilter = document.getElementById('dateFilter');
            uniqueDates.sort().forEach((date) => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = new Date(date + 'T12:00:00').toLocaleDateString('en-US', {
                    timeZone: EVENT_TIMEZONE,
                    weekday: 'long',
                    month: 'long',
                    day: 'numeric',
                });
                dateFilter.appendChild(option);
            });

            // Populate tag filter
            const tagFilterEl = document.getElementById('tagFilter');
            while (tagFilterEl.options.length > 1) tagFilterEl.remove(1);
            const tagSet = new Set();
            events.forEach((e) => (e.tags || []).forEach((t) => tagSet.add(t)));
            [...tagSet].sort().forEach((tag) => {
                const opt = document.createElement('option');
                opt.value = tag;
                opt.textContent = tag;
                tagFilterEl.appendChild(opt);
            });

            // Populate location filter
            const locationFilter = document.getElementById('locationFilter');
            uniqueLocations.forEach(location => {
                const option = document.createElement('option');
                option.value = location;
                option.textContent = location;
                locationFilter.appendChild(option);
            });

            // Display events
            displayEvents(events);

            try {
                if (localStorage.getItem('daadLineupViewTab') === 'schedule') {
                    setActiveScheduleTab('schedule');
                }
            } catch (e) {}

            document.getElementById('tab-by-stage').addEventListener('click', () => setActiveScheduleTab('stage'));
            document.getElementById('tab-by-schedule').addEventListener('click', () => setActiveScheduleTab('schedule'));

            // Add event listeners
            document.getElementById('dateFilter').addEventListener('change', () => filterEvents(events));
            document.getElementById('locationFilter').addEventListener('change', () => filterEvents(events));
            document.getElementById('artistFilter').addEventListener('input', () => filterEvents(events));
            document.getElementById('selectionFilter').addEventListener('change', () => filterEvents(events));
            document.getElementById('tagFilter').addEventListener('change', () => filterEvents(events));
            document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);

            // Add toggle details event listener
            document.getElementById('toggleDetails').addEventListener('click', () => {
                const detailsSection = document.getElementById('stageDetails');
                const toggleIcon = document.querySelector('#toggleDetails i');
                if (detailsSection.classList.contains('hidden')) {
                    detailsSection.classList.remove('hidden');
                    toggleIcon.classList.add('rotate-180');
                } else {
                    detailsSection.classList.add('hidden');
                    toggleIcon.classList.remove('rotate-180');
                }
            });
        }

        function clearFilters() {
            document.getElementById('dateFilter').value = '';
            document.getElementById('locationFilter').value = '';
            document.getElementById('tagFilter').value = '';
            document.getElementById('artistFilter').value = '';
            document.getElementById('selectionFilter').value = 'all';
            if (Array.isArray(window.allEvents)) filterEvents(window.allEvents);
        }

        // Filter events based on selected criteria
        function filterEvents(events) {
            const dateFilter = document.getElementById('dateFilter').value;
            const locationFilter = document.getElementById('locationFilter').value;
            const artistFilter = document.getElementById('artistFilter').value.toLowerCase();
            const selectionFilter = document.getElementById('selectionFilter').value;
            const tagFilter = document.getElementById('tagFilter').value;

            const filteredEvents = events.filter(event => {
                const matchesDate = !dateFilter || event.dayKey === dateFilter;
                const matchesLocation = !locationFilter || event.location === locationFilter;
                const matchesArtist = !artistFilter || event.summary.toLowerCase().includes(artistFilter);
                const matchesTag =
                    !tagFilter || (Array.isArray(event.tags) && event.tags.some((t) => t === tagFilter));
                const matchesSelection = selectionFilter === 'all' ||
                    (selectionFilter === 'selected' && window.selectedEvents.has(event.id)) ||
                    (selectionFilter === 'unselected' && !window.selectedEvents.has(event.id));
                return matchesDate && matchesLocation && matchesArtist && matchesTag && matchesSelection;
            });

            
            displayEvents(filteredEvents);
        }

        // Update selection overview
        function updateSelectionOverview(events) {
            const overviewPanel = document.getElementById('selectionOverview');
            const selectedEvents = events.filter(event => window.selectedEvents.has(event.id));
            
            if (selectedEvents.length === 0) {
                overviewPanel.classList.add('translate-y-full');
                return;
            }
            
            overviewPanel.classList.remove('translate-y-full');
            
            // Calculate statistics by stage
            const stageStats = {};
            selectedEvents.forEach(event => {
                if (!stageStats[event.location]) {
                    stageStats[event.location] = {
                        count: 0,
                        duration: 0
                    };
                }
                stageStats[event.location].count++;
                
                // Parse duration
                const duration = event.duration;
                const hoursMatch = duration.match(/(\d+)H/);
                const minutesMatch = duration.match(/(\d+)M/);
                const hours = hoursMatch ? parseInt(hoursMatch[1]) : 0;
                const minutes = minutesMatch ? parseInt(minutesMatch[1]) : 0;
                stageStats[event.location].duration += hours + (minutes / 60);
            });
            
            // Update stage statistics
            updateStageStats(stageStats);
            
            // Update total statistics
            const totalEvents = selectedEvents.length;
            const totalDuration = Object.values(stageStats)
                .reduce((sum, stats) => sum + stats.duration, 0);
            
            document.getElementById('totalEvents').textContent = totalEvents;
            document.getElementById('totalDuration').textContent = `${totalDuration.toFixed(1)} hours`;
            syncBackToTopOffset();
        }

        // Toggle event selection
        function toggleEventSelection(eventId) {
            const idNum = Number(eventId);
            if (!Number.isInteger(idNum)) return;
            const event = window.allEvents.find((e) => e.id === idNum);
            if (!event) return;
            if (window.selectedEvents.has(idNum)) {
                window.selectedEvents.delete(idNum);
            } else {
                window.selectedEvents.add(idNum);
            }

            persistSelectionsToStorage();
            updateSelectionOverview(window.allEvents);
            
            // Re-filter events to update the view
            filterEvents(window.allEvents);
        }

        // Display events in both tab panels
        function displayEvents(events) {
            const stagePanel = document.getElementById('panel-by-stage');
            const schedulePanel = document.getElementById('panel-by-schedule');
            displayListView(events, stagePanel);
            displayScheduleView(events, schedulePanel);
            hydrateSoundCloudSampleCovers(stagePanel);
            hydrateSoundCloudSampleCovers(schedulePanel);
            hydrateYouTubeMicrolinkThumbs(stagePanel);
            hydrateYouTubeMicrolinkThumbs(schedulePanel);
            updateStickyHeadingStates();
        }

        // Display events grouped by stage / venue
        function displayListView(events, container) {
            if (!events.length) {
                container.innerHTML =
                    '<p class="text-white/65 text-sm py-6 text-center">No sets match the current filters.</p>';
                return;
            }
            const groupedEvents = groupEventsByLocation(events);
            container.innerHTML = '';

            Object.entries(groupedEvents).forEach(([location, locationEvents]) => {
                const st = stageRowStyle(location);
                const locationSection = document.createElement('div');
                locationSection.className = 'mb-6';
                locationSection.innerHTML = `
                    <h2 class="daad-sticky-heading sticky top-[var(--daad-sticky-top,4.5rem)] z-[15] border-b border-white/15 font-display text-2xl sm:text-3xl uppercase tracking-[0.08em] text-white pb-3 mb-4 border-l-4 ${st.h2} transition-colors duration-200 ease-out -mx-4 min-w-0 sm:-mx-6 px-4 sm:px-6">${location}</h2>
                    <div class="space-y-2">
                        ${locationEvents.map((event) => renderEventCard(event)).join('')}
                    </div>
                `;
                container.appendChild(locationSection);
            });
        }

        function displayScheduleView(events, container) {
            if (!events.length) {
                container.innerHTML =
                    '<p class="text-white/65 text-sm py-6 text-center">No sets match the current filters.</p>';
                return;
            }
            const days = buildScheduleGroups(events);
            container.innerHTML = days
                .map(
                    (day) => `
                <section class="mb-10 last:mb-2">
                    <h2 class="daad-sticky-heading sticky top-[var(--daad-sticky-top,4.5rem)] z-[15] border-b border-white/15 font-display text-2xl sm:text-3xl uppercase tracking-[0.08em] text-white pb-3 mb-5 transition-colors duration-200 ease-out -mx-4 min-w-0 sm:-mx-6 px-4 sm:px-6">${formatDayHeading(day.dateKey)}</h2>
                    ${day.slots
                        .map((slot) => {
                            const conflict = slot.events.length > 1;
                            const gridClass = conflict
                                ? 'grid gap-2 sm:grid-cols-2'
                                : 'space-y-2';
                            const hint = conflict
                                ? `<span class="text-[10px] sm:text-xs font-bold uppercase tracking-[0.14em] text-amber-200/95 border border-amber-400/45 px-2 py-1 rounded-sm whitespace-nowrap">Same start — pick one stage</span>`
                                : '';
                            return `
                    <div class="mb-6 last:mb-0">
                        <div class="flex flex-wrap items-baseline gap-x-3 gap-y-2 mb-2 border-l-4 border-white/35 pl-3">
                            <h3 class="font-sans text-lg sm:text-xl font-bold text-white tabular-nums tracking-tight">${formatClockLabel(slot.startUtcMs)}</h3>
                            ${hint}
                        </div>
                        <div class="${gridClass}">
                            ${slot.events.map((event) => renderEventCard(event, { scheduleSlot: true })).join('')}
                        </div>
                    </div>`;
                        })
                        .join('')}
                </section>`
                )
                .join('');
        }

        // Group events by location
        function groupEventsByLocation(events) {
            return events.reduce((groups, event) => {
                if (!groups[event.location]) {
                    groups[event.location] = [];
                }
                groups[event.location].push(event);
                return groups;
            }, {});
        }

        // Update stage statistics
        function updateStageStats(stageStats) {
            const stageStatsContainer = document.getElementById('stageStats');
            const selectedEvents = window.allEvents.filter(event => window.selectedEvents.has(event.id));
            
            // Calculate daily statistics
            const dailyStats = {};
            selectedEvents.forEach(event => {
                const date = event.dayKey;
                if (!dailyStats[date]) {
                    dailyStats[date] = {
                        count: 0,
                        duration: 0
                    };
                }
                dailyStats[date].count++;
                
                // Parse duration
                const duration = event.duration;
                const hoursMatch = duration.match(/(\d+)H/);
                const minutesMatch = duration.match(/(\d+)M/);
                const hours = hoursMatch ? parseInt(hoursMatch[1]) : 0;
                const minutes = minutesMatch ? parseInt(minutesMatch[1]) : 0;
                dailyStats[date].duration += hours + (minutes / 60);
            });

            // Sort dates
            const sortedDates = Object.keys(dailyStats).sort();

            stageStatsContainer.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <h4 class="font-display text-lg uppercase tracking-[0.12em] text-white mb-3">By stage</h4>
                        ${Object.entries(stageStats)
                            .map(([stage, stats]) => `
                                <div class="flex justify-between items-center gap-4 text-sm">
                                    <span class="text-white font-medium">${stage}</span>
                                    <div class="text-white/60 font-medium tabular-nums">
                                        <span>${stats.count} sets</span>
                                        <span class="mx-2 text-white/30">·</span>
                                        <span>${stats.duration.toFixed(1)} h</span>
                                    </div>
                                </div>
                            `).join('')}
                    </div>
                    <div class="border-t border-white/15 pt-4">
                        <h4 class="font-display text-lg uppercase tracking-[0.12em] text-white mb-3">By day</h4>
                        ${sortedDates
                            .map(date => {
                                const stats = dailyStats[date];
                                const formattedDate = new Date(date).toLocaleDateString('en-US', {
                                    weekday: 'short',
                                    month: 'short',
                                    day: 'numeric'
                                });
                                return `
                                    <div class="flex justify-between items-center gap-4 text-sm">
                                        <span class="text-white font-medium">${formattedDate}</span>
                                        <div class="text-white/60 font-medium tabular-nums">
                                            <span>${stats.count} sets</span>
                                            <span class="mx-2 text-white/30">·</span>
                                            <span>${stats.duration.toFixed(1)} h</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                    </div>
                </div>
            `;
        }

        function persistSelectionsToStorage() {
            try {
                localStorage.setItem('daadSelectedEvents', JSON.stringify([...window.selectedEvents]));
            } catch (e) {}
        }

        // Initialize the application when the page loads
        document.addEventListener('DOMContentLoaded', init);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('./sw.js')
                    .catch((err) => console.warn('SW registration failed:', err));
            });
        }

        (function setupMobileInstallGate() {
            const DISMISSED_KEY = 'daadInstallGateDismissed';
            const LEGACY_IOS_DISMISSED_KEY = 'daadIosInstallHintDismissed';
            const MOBILE_MQ = '(max-width: 767px)';

            function migrateLegacyDismissal() {
                try {
                    if (localStorage.getItem(DISMISSED_KEY) === '1') return;
                    if (localStorage.getItem(LEGACY_IOS_DISMISSED_KEY) === '1') {
                        localStorage.setItem(DISMISSED_KEY, '1');
                    }
                } catch (e) {}
            }

            function isInstalledPwa() {
                return (
                    window.matchMedia('(display-mode: standalone)').matches ||
                    window.matchMedia('(display-mode: fullscreen)').matches ||
                    (typeof navigator !== 'undefined' && navigator.standalone === true)
                );
            }

            function isDismissed() {
                try {
                    return localStorage.getItem(DISMISSED_KEY) === '1';
                } catch (e) {
                    return false;
                }
            }

            function shouldShowGate() {
                migrateLegacyDismissal();
                return (
                    window.matchMedia(MOBILE_MQ).matches &&
                    !isInstalledPwa() &&
                    !isDismissed()
                );
            }

            let overlayEl = null;

            function hideGate() {
                if (!overlayEl) return;
                const gate = overlayEl;
                Array.from(document.body.children).forEach((node) => {
                    if (node !== gate) node.inert = false;
                });
                gate.remove();
                overlayEl = null;
                syncDaadBodyScrollLock();
            }

            function dismissGate() {
                try {
                    localStorage.setItem(DISMISSED_KEY, '1');
                } catch (e) {}
                hideGate();
            }

            function showGate() {
                if (overlayEl) return;

                overlayEl = document.createElement('div');
                overlayEl.id = 'daadInstallGate';
                overlayEl.setAttribute('role', 'dialog');
                overlayEl.setAttribute('aria-modal', 'true');
                overlayEl.setAttribute('aria-labelledby', 'daadInstallGateTitle');
                overlayEl.tabIndex = -1;
                overlayEl.innerHTML = `
                    <div class="daad-install-gate-panel">
                        <h2 id="daadInstallGateTitle">Install for offline access</h2>
                        <p class="daad-install-gate-lede">This schedule works best as an installed app on your phone. Add it to your home screen, then open it from the icon.</p>
                        <div class="daad-install-gate-steps">
                            <div>
                                <p class="platform">iPhone / iPad</p>
                                <p>Tap <span class="emph">Share</span>, then <span class="emph">Add to Home Screen</span>.</p>
                            </div>
                            <div>
                                <p class="platform">Android</p>
                                <p>Open the browser menu (<span class="emph">⋮</span>), then choose <span class="emph">Install app</span> or <span class="emph">Add to Home screen</span>.</p>
                            </div>
                        </div>
                        <button type="button" id="daadInstallGateDismiss">Continue in browser</button>
                    </div>
                `;

                document.body.appendChild(overlayEl);
                Array.from(document.body.children).forEach((node) => {
                    if (node !== overlayEl) node.inert = true;
                });
                syncDaadBodyScrollLock();

                overlayEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') dismissGate();
                });

                const dismissBtn = overlayEl.querySelector('#daadInstallGateDismiss');
                dismissBtn.addEventListener('click', dismissGate);
                dismissBtn.focus();
            }

            function syncGate() {
                if (shouldShowGate()) showGate();
                else hideGate();
            }

            const mqMobile = window.matchMedia(MOBILE_MQ);
            const mqStandalone = window.matchMedia('(display-mode: standalone)');
            const mqFullscreen = window.matchMedia('(display-mode: fullscreen)');

            mqMobile.addEventListener('change', syncGate);
            mqStandalone.addEventListener('change', syncGate);
            mqFullscreen.addEventListener('change', syncGate);

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', syncGate);
            } else {
                syncGate();
            }
        })();
    </script>
